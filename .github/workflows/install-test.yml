name: Install Test

on:
  workflow_call:
    inputs:
      release_mode:
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  install-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Pin global uv version for mise shims
        shell: bash
        run: |
          UV_VER=$(awk -F '"' '/^uv =/{print $2; exit}' mise.toml)
          mise use -g "uv@${UV_VER}"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build litellm macOS wheel (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: bash scripts/build-litellm-wheel.sh

      - name: Remove build tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get remove --purge -y gcc g++ clang rustc cargo build-essential make 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true

      - name: Remove build tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Remove active Apple C toolchain (selected Xcode or Command Line Tools)
          DEV_DIR=$(xcode-select -p 2>/dev/null || true)
          if [ -n "$DEV_DIR" ]; then
            if [[ "$DEV_DIR" == /Library/Developer/CommandLineTools* ]]; then
              sudo rm -rf /Library/Developer/CommandLineTools
            else
              sudo rm -rf "$(dirname "$DEV_DIR")"
              sudo rm -rf /Library/Developer/CommandLineTools
            fi
          fi
          # Remove Rust toolchain
          rm -rf "$HOME/.cargo" "$HOME/.rustup"

      - name: Remove build tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
              $installPaths = @(& $vswhere -all -property installationPath)
              if (-not $installPaths) {
                  Write-Warning "No Visual Studio instance found; cannot hide MSVC build tools"
              }
              foreach ($installPath in $installPaths) {
                  foreach ($sub in @('VC\Tools\MSVC', 'VC\Tools\Llvm')) {
                      $dir = Join-Path $installPath $sub
                      if (Test-Path $dir) {
                          try {
                              Rename-Item $dir "$dir.bak" -ErrorAction Stop
                          } catch {
                              Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
                          }
                      }
                  }
              }
          } else {
              Write-Warning "vswhere.exe not found; cannot hide MSVC build tools"
          }
          foreach ($dir in @($env:RUSTUP_HOME, $env:CARGO_HOME, "$env:USERPROFILE\.rustup", "$env:USERPROFILE\.cargo")) {
              if ($dir -and (Test-Path $dir)) {
                  Remove-Item $dir -Recurse -Force
              }
          }

      - name: Extract pinned Langflow version
        shell: bash
        run: |
          if [ -f src/install-langflow.sh ]; then
            LF_VER=$(awk -F '"' '/^LANGFLOW_VERSION=/{print $2; exit}' src/install-langflow.sh)
          else
            LF_VER=$(awk -F '"' '/^\$LangflowVersion/{print $2; exit}' src/install-langflow-script.ps1)
          fi
          echo "LANGFLOW_VERSION=$LF_VER" >> "$GITHUB_ENV"
          echo "Pinned Langflow version: $LF_VER"

      - name: Run the real installer script
        shell: bash
        timeout-minutes: 15
        run: |
          mkdir -p "$HOME/Desktop"
          if [ "$RUNNER_OS" = "Windows" ]; then
            SPACED_DIR="$RUNNER_TEMP/Langflow Installer"
          else
            SPACED_DIR="$HOME/Langflow Installer"
          fi
          mkdir -p "$SPACED_DIR"
          cp -r src "$SPACED_DIR/src"
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf 'I\n\n' | powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$SPACED_DIR/src/install-langflow-script.ps1"
          else
            printf 'I\n\n' | bash "$SPACED_DIR/src/install-langflow.sh"
          fi

      - name: Verify installation
        shell: bash
        run: bash scripts/verify-install.sh "$RUNNER_OS" "$LANGFLOW_VERSION"

      - name: Verify release consistency
        if: ${{ inputs.release_mode }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SCRIPT_VER=$(awk -F '"' '/^SCRIPT_VERSION=/{print $2; exit}' src/install-langflow.sh)
          echo "Tag: $TAG, Script: $SCRIPT_VER"
          if [ "$TAG" != "$SCRIPT_VER" ]; then
            echo "::error::Tag $TAG does not match script version $SCRIPT_VER"
            exit 1
          fi
