name: Release

on:
  push:
    tags: "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install PSScriptAnalyzer
        run: mise exec -- pwsh -NoProfile -Command "Install-Module PSScriptAnalyzer -Scope CurrentUser -Force"
      - run: bash scripts/verify.sh

  constraint-test:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Remove build tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get remove --purge -y gcc g++ clang rustc cargo build-essential make 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true

      - name: Remove build tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Remove active Apple C toolchain (selected Xcode or Command Line Tools)
          DEV_DIR=$(xcode-select -p 2>/dev/null || true)
          if [ -n "$DEV_DIR" ]; then
            if [[ "$DEV_DIR" == /Library/Developer/CommandLineTools* ]]; then
              sudo rm -rf /Library/Developer/CommandLineTools
            else
              sudo rm -rf "$(dirname "$DEV_DIR")"
              sudo rm -rf /Library/Developer/CommandLineTools
            fi
          fi
          # Remove Rust toolchain
          rm -rf "$HOME/.cargo" "$HOME/.rustup"

      - name: Remove build tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
              $installPaths = @(& $vswhere -all -property installationPath)
              if (-not $installPaths) {
                  Write-Warning "No Visual Studio instance found; cannot hide MSVC build tools"
              }
              foreach ($installPath in $installPaths) {
                  foreach ($sub in @('VC\Tools\MSVC', 'VC\Tools\Llvm')) {
                      $dir = Join-Path $installPath $sub
                      if (Test-Path $dir) {
                          try {
                              Rename-Item $dir "$dir.bak" -ErrorAction Stop
                          } catch {
                              Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
                          }
                      }
                  }
              }
          } else {
              Write-Warning "vswhere.exe not found; cannot hide MSVC build tools"
          }
          foreach ($dir in @($env:RUSTUP_HOME, $env:CARGO_HOME, "$env:USERPROFILE\.rustup", "$env:USERPROFILE\.cargo")) {
              if ($dir -and (Test-Path $dir)) {
                  Remove-Item $dir -Recurse -Force
              }
          }

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Extract pinned version from installer script
        shell: bash
        run: |
          if [ -f src/install-langflow.sh ]; then
            LF_VER=$(awk -F '"' '/^LANGFLOW_VERSION=/{print $2; exit}' src/install-langflow.sh)
          else
            LF_VER=$(awk -F '"' '/^\$LangflowVersion/{print $2; exit}' src/install-langflow-script.ps1)
          fi
          echo "LANGFLOW_VERSION=$LF_VER" >> "$GITHUB_ENV"

      - name: Create venv and install pinned langflow with constraints
        shell: bash
        run: |
          uv venv .venv
          uv pip install "langflow==${LANGFLOW_VERSION}" --constraint src/constraints.txt

      - name: Verify version matches tag
        shell: bash
        run: |
          INSTALLED=$(uv run langflow --version 2>/dev/null | awk '/^langflow /{print $2; exit}')
          TAG="${GITHUB_REF_NAME#v}"
          echo "Installed: $INSTALLED, Tag: $TAG, Pin: $LANGFLOW_VERSION"
          if [ "$INSTALLED" != "$TAG" ]; then
            echo "::error::Installed version $INSTALLED does not match tag $TAG"
            exit 1
          fi
          if [ "$INSTALLED" != "$LANGFLOW_VERSION" ]; then
            echo "::error::Installed version $INSTALLED does not match script pin $LANGFLOW_VERSION"
            exit 1
          fi

  package:
    needs: [verify, constraint-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: zips
          path: dist/*.zip

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: zips
          path: dist
      - name: Generate release notes
        run: bash scripts/release-notes.sh "${{ github.ref_name }}" CHANGELOG.md > release-notes.md
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "${{ github.ref_name }}" =~ (beta|rc|alpha) ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            $PRERELEASE \
            dist/*.zip
