name: Release

on:
  push:
    tags: "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix"
            exit 1
          fi
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: Install PSScriptAnalyzer
        run: mise exec -- pwsh -NoProfile -Command "Install-Module PSScriptAnalyzer -Scope CurrentUser -Force"
      - run: bash scripts/verify.sh

  install-test:
    needs: verify
    uses: ./.github/workflows/install-test.yml
    with:
      release_mode: true

  package:
    needs: [verify, install-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zips
          path: dist/*.zip

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zips
          path: dist
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release-notes.sh "$RELEASE_TAG" CHANGELOG.md > release-notes.md
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          if [[ "$RELEASE_TAG" =~ (beta|rc|alpha) ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            $PRERELEASE \
            dist/*.zip
