name: Release

on:
  push:
    tags: "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: zips
          path: dist/*.zip

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: zips
          path: dist
      - name: Generate release notes
        run: bash scripts/release-notes.sh "${{ github.ref_name }}" CHANGELOG.md > release-notes.md
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "${{ github.ref_name }}" =~ (beta|rc|alpha) ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            $PRERELEASE \
            dist/*.zip
