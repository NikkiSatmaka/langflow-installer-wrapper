name: Release

on:
  push:
    tags: "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install PSScriptAnalyzer
        run: mise exec -- pwsh -NoProfile -Command "Install-Module PSScriptAnalyzer -Scope CurrentUser -Force"
      - run: bash scripts/verify.sh

  constraint-test:
    needs: verify
    uses: ./.github/workflows/constraint-test.yml
    with:
      release_mode: true

  litellm-wheel:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Build litellm macOS wheel
        run: bash scripts/build-litellm-wheel.sh dist/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: litellm-wheel
          path: dist/wheels/litellm-*.whl

  package:
    needs: [verify, constraint-test, litellm-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: litellm-wheel
          path: wheels
      - run: bash scripts/package.sh "${{ github.ref_name }}" wheels
      - uses: actions/upload-artifact@v4
        with:
          name: zips
          path: dist/*.zip

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: zips
          path: dist
      - name: Generate release notes
        run: bash scripts/release-notes.sh "${{ github.ref_name }}" CHANGELOG.md > release-notes.md
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "${{ github.ref_name }}" =~ (beta|rc|alpha) ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            $PRERELEASE \
            dist/*.zip
